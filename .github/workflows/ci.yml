name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgresql://sgela:sgela@localhost:5432/sgela
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: sgela
          POSTGRES_PASSWORD: sgela
          POSTGRES_DB: sgela
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sgela" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - name: Prisma migrate check
        run: pnpm --filter @sgela/db exec prisma migrate deploy
      - run: pnpm db:seed
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Install Playwright browsers
        run: pnpm --filter @sgela/web exec playwright install --with-deps chromium
      - name: Playwright smoke
        run: pnpm e2e
      - name: Lighthouse CI (/home, /explore, /learn)
        working-directory: apps/web
        run: npx --yes @lhci/cli@0.15.1 autorun
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
